version: '3.8'

services:
  # HCX Platform Services
  hcx-api-gateway:
    image: ghcr.io/healthflowegy/hcx-api-gateway:latest
    container_name: hcx-api-gateway
    ports:
      - "8090:8090"
    environment:
      - SPRING_PROFILES_ACTIVE=egyptian,prod
      - HCX_APIS_URL=http://hcx-apis:8080
      - EGYPTIAN_KYC_REGISTRY_URL=http://egyptian-kyc-service:8082
      - EGYPTIAN_HCX_INTEGRATION_URL=http://egyptian-hcx-integration:8081
    depends_on:
      - hcx-apis
      - egyptian-hcx-integration
      - egyptian-kyc-service
    networks:
      - hcx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  hcx-apis:
    image: ghcr.io/healthflowegy/hcx-apis:latest
    container_name: hcx-apis
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=egyptian,prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/hcx
      - SPRING_DATASOURCE_USERNAME=hcx_user
      - SPRING_DATASOURCE_PASSWORD=hcx_password
      - SPRING_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EGYPTIAN_KYC_REGISTRY_URL=http://egyptian-kyc-service:8082
      - HCX_ENCRYPTION_KEY=${HCX_ENCRYPTION_KEY}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - hcx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Egyptian Healthcare Services
  egyptian-hcx-integration:
    image: ghcr.io/healthflowegy/egyptian-hcx-integration:latest
    container_name: egyptian-hcx-integration
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/egyptian_hcx
      - SPRING_DATASOURCE_USERNAME=hcx_user
      - SPRING_DATASOURCE_PASSWORD=hcx_password
      - SPRING_REDIS_HOST=redis
      - HCX_PLATFORM_URL=http://hcx-apis:8080
      - EGYPTIAN_KYC_REGISTRY_URL=http://egyptian-kyc-service:8082
      - MOI_EKYC_API_URL=${MOI_EKYC_API_URL}
      - MOI_EKYC_API_KEY=${MOI_EKYC_API_KEY}
      - NTRA_API_URL=${NTRA_API_URL}
      - NTRA_API_KEY=${NTRA_API_KEY}
      - FRA_API_URL=${FRA_API_URL}
      - FRA_API_KEY=${FRA_API_KEY}
      - CEQUENS_API_URL=${CEQUENS_API_URL}
      - CEQUENS_USERNAME=${CEQUENS_USERNAME}
      - CEQUENS_PASSWORD=${CEQUENS_PASSWORD}
      - HCX_ENCRYPTION_KEY=${HCX_ENCRYPTION_KEY}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hcx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  egyptian-kyc-service:
    image: ghcr.io/healthflowegy/egyptian-kyc-registry:latest
    container_name: egyptian-kyc-service
    ports:
      - "8082:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/kyc_registry
      - SPRING_DATASOURCE_USERNAME=hcx_user
      - SPRING_DATASOURCE_PASSWORD=hcx_password
      - SPRING_REDIS_HOST=redis
      - MOI_EKYC_API_URL=${MOI_EKYC_API_URL}
      - MOI_EKYC_API_KEY=${MOI_EKYC_API_KEY}
      - NTRA_API_URL=${NTRA_API_URL}
      - NTRA_API_KEY=${NTRA_API_KEY}
      - CEQUENS_API_URL=${CEQUENS_API_URL}
      - CEQUENS_USERNAME=${CEQUENS_USERNAME}
      - CEQUENS_PASSWORD=${CEQUENS_PASSWORD}
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY}
      - SECURITY_JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hcx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Infrastructure Services
  postgres:
    image: postgres:15-alpine
    container_name: hcx-postgres
    environment:
      - POSTGRES_DB=hcx
      - POSTGRES_USER=hcx_user
      - POSTGRES_PASSWORD=hcx_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    networks:
      - hcx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hcx_user -d hcx"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hcx-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hcx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: hcx-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - hcx-network
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: hcx-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - hcx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Monitoring Services
  prometheus:
    image: prom/prometheus:latest
    container_name: hcx-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - hcx-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: hcx-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - hcx-network
    restart: unless-stopped

  # Load Balancer
  nginx:
    image: nginx:alpine
    container_name: hcx-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - hcx-api-gateway
      - hcx-apis
      - egyptian-hcx-integration
      - egyptian-kyc-service
    networks:
      - hcx-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  zookeeper_data:
  prometheus_data:
  grafana_data:

networks:
  hcx-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

